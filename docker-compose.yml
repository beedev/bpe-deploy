# PromoEngine POC. Generated by scripts/publish-deploy.sh from bpe d2b4b4c; do not edit here. Pulls the images from ghcr.io.
# The hosted PromoEngine POC stack (docs/design/HOSTING-DESIGN.md). Source of docker-compose.yml in the public install
# repository beedev/bpe-deploy: scripts/publish-deploy.sh copies it there, drops the build blocks (the images come from
# ghcr.io) and checks that every setting the development stack (compose.yaml) gives a service is given here too.
#
# Every value comes from .env next to this file, written by install.sh: the addresses, the port, and the secrets it generates
# on the server (none is in this file, the repository or an image). Only the edge listens on the host, on 127.0.0.1.
#
# Order of start: certs (one-shot: certificates) -> postgres, keycloak -> the five services -> seed (one-shot: demo data,
# storefront keys, then it deletes its own sign-in client) -> admin web, storefront -> edge.
name: bpe

x-restart: &restart
  restart: unless-stopped

x-service: &service
  <<: *restart
  volumes:
    - certs:/certs:ro
  depends_on:
    certs:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/promo_v3
  DB_OWNER_USER: ${DB_OWNER_USER:?run install.sh}
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run install.sh}
  DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:?run install.sh}
  # Tokens name the address a person reaches the sign-in at; the keys are fetched over the compose network.
  PROMO_ISSUER: ${BPE_KEYCLOAK_URL:?run install.sh}/realms/promo
  PROMO_JWKS_URL: http://keycloak:8080/bpe-keycloak/realms/promo/protocol/openid-connect/certs
  PROMO_AUDIENCE: promo-api
  PROMO_CERT_DIR: /certs
  # The admin web's pages call the services through the edge, from this origin.
  PROMO_CORS_ALLOWED_ORIGINS: ${BPE_ORIGIN:?run install.sh}

x-java-health: &java-health
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 30s

services:
  # One-shot: the local certificate authority, the services' certificates and the receipt keys, into the volume certs.
  certs:
    image: ghcr.io/beedev/bpe-seed:${BPE_TAG:-latest}
    command: ["certs"]
    restart: "no"
    volumes:
      - certs:/certs

  postgres:
    <<: *restart
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:?run install.sh}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?run install.sh}
      POSTGRES_DB: promo_v3
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d promo_v3"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8.2
    # Served under /bpe-keycloak, the same path the browser uses, so the edge and the server's nginx pass it unchanged.
    command: ["start-dev", "--import-realm", "--http-relative-path=/bpe-keycloak"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?run install.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run install.sh}
      KC_HEALTH_ENABLED: "true"
      # Keeps the health answer on port 9000 at /health/ready, whatever the relative path.
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      # Tokens always carry this issuer; the services and the seed reach Keycloak as keycloak:8080 (backchannel).
      KC_HOSTNAME: ${BPE_KEYCLOAK_URL:?run install.sh}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Behind the edge (and on a server, its HTTPS nginx), Keycloak trusts the X-Forwarded headers for scheme and client address.
      KC_PROXY_HEADERS: xforwarded
      # Filled into the realm file at its first import (scripts/hosted_realm.py): the demo people's password, the client
      # secrets, and the admin web's address for the sign-in return.
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?run install.sh}
      PROMO_ADMINISTRATION_CLIENT_SECRET: ${PROMO_ADMINISTRATION_CLIENT_SECRET:?run install.sh}
      PROMO_SEED_CLIENT_SECRET: ${PROMO_SEED_CLIENT_SECRET:?run install.sh}
      BPE_URL: ${BPE_URL:?run install.sh}
      BPE_ORIGIN: ${BPE_ORIGIN:?run install.sh}
    volumes:
      # The realm lives here once imported; a later start keeps it (and keeps the seed client deleted).
      - kcdata:/opt/keycloak/data
      - ./config/keycloak/promo-realm.json:/opt/keycloak/data/import/promo-realm.json:ro
      - ./config/keycloak/themes/promo:/opt/keycloak/themes/promo:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  pricing-engine:
    <<: *service
    image: ghcr.io/beedev/bpe-pricing-engine:${BPE_TAG:-latest}
    environment:
      <<: *service-env
      SVC_PRICING_ENGINE_PASSWORD: ${SVC_PRICING_ENGINE_PASSWORD:?run install.sh}
      SERVER_PORT: "8081"
      PROMO_INTERNAL_PORT: "8481"
      PROMO_AUTHORING_INTERNAL_URL: https://promotion-authoring:8482
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness"]

  promotion-authoring:
    <<: *service
    image: ghcr.io/beedev/bpe-promotion-authoring:${BPE_TAG:-latest}
    environment:
      <<: *service-env
      SVC_PROMOTION_AUTHORING_PASSWORD: ${SVC_PROMOTION_AUTHORING_PASSWORD:?run install.sh}
      SERVER_PORT: "8082"
      PROMO_INTERNAL_PORT: "8482"
      PROMO_ENGINE_URL: https://pricing-engine:8481
      PROMO_CATALOG_URL: http://catalog:8083
      # PROMO_PROMETHEUS_PUBLIC is NOT set here: on a reachable server the alert metric needs a token.
    # After the catalog, so the two migrations that create pg_trgm never run at the same moment (as in compose.yaml).
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness"]

  catalog:
    <<: *service
    image: ghcr.io/beedev/bpe-catalog:${BPE_TAG:-latest}
    environment:
      <<: *service-env
      SVC_CATALOG_PASSWORD: ${SVC_CATALOG_PASSWORD:?run install.sh}
      SERVER_PORT: "8083"
      PROMO_INTERNAL_PORT: "8483"
      PROMO_ENGINE_URL: https://pricing-engine:8481
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness"]

  administration:
    <<: *service
    image: ghcr.io/beedev/bpe-administration:${BPE_TAG:-latest}
    environment:
      <<: *service-env
      SVC_ADMINISTRATION_PASSWORD: ${SVC_ADMINISTRATION_PASSWORD:?run install.sh}
      SERVER_PORT: "8084"
      PROMO_INTERNAL_PORT: "8484"
      PROMO_ENGINE_URL: https://pricing-engine:8481
      PROMO_KEYCLOAK_URL: http://keycloak:8080/bpe-keycloak
      PROMO_ADMINISTRATION_CLIENT_SECRET: ${PROMO_ADMINISTRATION_CLIENT_SECRET:?run install.sh}
      PROMO_AUTHORING_INTERNAL_URL: https://promotion-authoring:8482
      PROMO_CATALOG_INTERNAL_URL: https://catalog:8483
      PROMO_ASSIST_INTERNAL_URL: https://ai-assist:8485
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness"]

  ai-assist:
    <<: *service
    image: ghcr.io/beedev/bpe-ai-assist:${BPE_TAG:-latest}
    environment:
      <<: *service-env
      SVC_AI_ASSIST_PASSWORD: ${SVC_AI_ASSIST_PASSWORD:?run install.sh}
      SERVER_PORT: "8085"
      PROMO_INTERNAL_PORT: "8485"
      # live when OPENAI_API_KEY is in .env (install.sh sets the mode), stub (recorded answers, no network) otherwise.
      # The per-person and per-task budgets are in the code (TaskBudget) and hold either way.
      PROMO_AI_MODE: ${PROMO_AI_MODE:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # One person's AI tokens a day (DEC-AI-PERSON-TOKENS-500K), as in compose.yaml; set it in .env to change it.
      PROMO_AI_PERSON_TOKENS_PER_DAY: ${PROMO_AI_PERSON_TOKENS_PER_DAY:-500000}
      PROMO_AUTHORING_URL: http://promotion-authoring:8082
      PROMO_CATALOG_URL: http://catalog:8083
      PROMO_ADMINISTRATION_URL: http://administration:8084
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health/readiness"]

  # One-shot: the demo data (only on a new database), the storefront keys, then the seed's sign-in client is deleted.
  seed:
    image: ghcr.io/beedev/bpe-seed:${BPE_TAG:-latest}
    command: ["seed"]
    restart: "no"
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:?run install.sh}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?run install.sh}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?run install.sh}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?run install.sh}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run install.sh}
      PROMO_KEYCLOAK_URL: http://keycloak:8080/bpe-keycloak
      PROMO_TOKEN_CLIENT_ID: promo-seed
      PROMO_TOKEN_CLIENT_SECRET: ${PROMO_SEED_CLIENT_SECRET:?run install.sh}
      # The hosted realm has no test users; areed (Super admin, every site) acts for su1 and v1 in the seed scripts.
      PROMO_PERSONA_MAP: su1=areed,v1=areed
    volumes:
      - certs:/certs:ro
      - shopkeys:/run/promo
    depends_on:
      pricing-engine:
        condition: service_healthy
      promotion-authoring:
        condition: service_healthy
      catalog:
        condition: service_healthy
      administration:
        condition: service_healthy
      ai-assist:
        condition: service_healthy

  admin-web:
    <<: *restart
    image: ghcr.io/beedev/bpe-admin-web:${BPE_TAG:-latest}
    environment:
      ADMIN_WEB_RELEASE: TEST
      ADMIN_WEB_KEYCLOAK_URL: ${BPE_KEYCLOAK_URL:?run install.sh}
      ADMIN_WEB_API_URL: ${BPE_API_URL:?run install.sh}/authoring
      ADMIN_WEB_CATALOG_URL: ${BPE_API_URL:?run install.sh}/catalog
      ADMIN_WEB_ASSIST_URL: ${BPE_API_URL:?run install.sh}/assist
      ADMIN_WEB_ADMIN_URL: ${BPE_API_URL:?run install.sh}/administration
    depends_on:
      keycloak:
        condition: service_healthy
      promotion-authoring:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/bpe').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  storefront:
    <<: *restart
    image: ghcr.io/beedev/bpe-storefront:${BPE_TAG:-latest}
    environment:
      STOREFRONT_ENGINE_URL: http://pricing-engine:8081
      STOREFRONT_KEYS_FILE: /run/promo/storefront-keys.json
      STOREFRONT_CATALOG_FILE: /data/test-catalog/catalog-feed.csv
      STOREFRONT_SAMPLES_FILE: /data/test-catalog/golden-carts.json
    volumes:
      - shopkeys:/run/promo:ro
      - ./config/test-catalog:/data/test-catalog:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/bpe-shop/api/samples').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  # The one door: every path the browser uses, on one port of this machine only (127.0.0.1).
  edge:
    <<: *restart
    image: nginx:1.27-alpine
    volumes:
      - ./config/edge/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${BPE_PORT:?run install.sh}:8080"
    depends_on:
      admin-web:
        condition: service_healthy
      storefront:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  kcdata:
  certs:
  shopkeys:
