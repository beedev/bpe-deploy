# The edge of the hosted stack (docs/design/HOSTING-DESIGN.md sections 1 and 7): one small nginx in front of everything the
# browser reaches, so the whole stack is one origin and one port (BPE_PORT on 127.0.0.1). The paths are the same on every
# installation; only the address in front of them changes (http://localhost:<port> on a computer, https://<host> on a server,
# where the server's own nginx passes /bpe... here unchanged).
#
#   /bpe/...                  admin web (Next.js, built with basePath /bpe; it keeps the path)
#   /bpe-shop/...             storefront (Next.js, built with basePath /bpe-shop; it keeps the path)
#   /bpe-keycloak/...         sign-in (Keycloak, started with --http-relative-path=/bpe-keycloak; it keeps the path)
#   /bpe-api/authoring/...    promotion-authoring  \
#   /bpe-api/catalog/...      catalog               |  the four services the admin web's pages call; the prefix is
#   /bpe-api/assist/...       ai-assist             |  removed, so each service sees its own /v1/... paths
#   /bpe-api/administration/  administration       /
# The pricing engine and every internal (mutual TLS) port stay on the compose network: no browser calls them.

# The server's own nginx tells which scheme and host the person used; on a computer nothing in front sets them.
map $http_x_forwarded_proto $bpe_proto { default $http_x_forwarded_proto; "" $scheme; }
map $http_x_forwarded_host $bpe_host { default $http_x_forwarded_host; "" $http_host; }

server {
    listen 8080;
    server_name _;
    # Catalog feeds are uploaded through /bpe-api/catalog (the master feed is about 0.2 MB; Bass Pro's full extract is larger).
    client_max_body_size 64m;
    # Keycloak's and Next.js's answers carry large headers (cookies, the content policy).
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    # The assistant can take a while to answer.
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $bpe_host;
    proxy_set_header X-Forwarded-Proto $bpe_proto;
    proxy_set_header X-Forwarded-Host $bpe_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # Docker's own name server, asked again every 10 seconds: a container that restarts gets a new address, and a name
    # written straight into proxy_pass would keep the old one until this nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_web admin-web:3100;
    set $storefront storefront:3200;
    set $keycloak keycloak:8080;
    set $authoring promotion-authoring:8082;
    set $catalog catalog:8083;
    set $assist ai-assist:8085;
    set $administration administration:8084;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = /bpe { proxy_pass http://$admin_web; }
    location /bpe/ { proxy_pass http://$admin_web; }
    location = /bpe-shop { proxy_pass http://$storefront; }
    location /bpe-shop/ { proxy_pass http://$storefront; }
    location /bpe-keycloak/ { proxy_pass http://$keycloak; }

    # The prefix is removed: /bpe-api/authoring/v1/promotions reaches promotion-authoring as /v1/promotions.
    location /bpe-api/authoring/ { rewrite ^/bpe-api/authoring(/.*)$ $1 break; proxy_pass http://$authoring; }
    location /bpe-api/catalog/ { rewrite ^/bpe-api/catalog(/.*)$ $1 break; proxy_pass http://$catalog; }
    location /bpe-api/assist/ { rewrite ^/bpe-api/assist(/.*)$ $1 break; proxy_pass http://$assist; }
    location /bpe-api/administration/ { rewrite ^/bpe-api/administration(/.*)$ $1 break; proxy_pass http://$administration; }

    # The bare address goes to the admin web.
    location = / { return 302 $bpe_proto://$bpe_host/bpe; }
    location / { return 404; }
}
